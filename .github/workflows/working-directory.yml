name: Working Directory Check
on: [push, pull_request]
jobs:
  working-directory-check:
    name: Working Directory Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Check exchanged file sizes
      run: working/bin/check
    - name: Check that only the skeleton of working/ merges
      if: github.event_name == 'pull_request' && (github.base_ref == github.event.repository.default_branch)
      run: working/bin/check --merge
