# Tuolumne packages.yaml
# Version 2.0
packages:
  ##################################################################
  # General variants we always want on this system
  ##################################################################
  all:
    variants: +rocm amdgpu_target=gfx942
    providers:
      blas: [cray-libsci@25.09.0, openblas]
      fftw-api: [cray-fftw, fftw]
      lapack: [cray-libsci@25.09.0, openblas]
      mpi: [cray-mpich]
      scalapack: [netlib-scalapack]
  ##################################################################
  # Compiler rules for this system.
  # Main change from auto-added compilers is the added rpaths in cce
  ##################################################################
  cce:
    externals:
    - spec: cce@20.0.0
      prefix: /opt/cray/pe/cce/20.0.0
      extra_attributes:
        compilers:
          c: /opt/cray/pe/cce/20.0.0/bin/craycc
          cxx: /opt/cray/pe/cce/20.0.0/bin/crayCC
          fortran: /opt/cray/pe/cce/20.0.0/bin/crayftn
        # Rpaths added because spack doesn't know about them automatically
        # and we don't want to rely on LD_LIBRARY_PATH if we can avoid it.
        extra_rpaths:
        - /opt/cray/pe/gcc-libs
        - /opt/cray/pe/lib64/cce
        - /opt/cray/libfabric/2.1/lib64
  llvm:
    externals:
    - spec: llvm@21.1.8+clang~flang+lld+lldb
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang
          cxx: /usr/bin/clang++
    - spec: llvm@21.1.8+clang~flang~lld~lldb
      prefix: /usr/lib64/ccache
      extra_attributes:
        compilers:
          c: /usr/lib64/ccache/clang
          cxx: /usr/lib64/ccache/clang++
  gcc:
    externals:
    - spec: gcc@8.5.0 languages:='c,c++,fortran' platform=linux os=rhel8 target=x86_64
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
    - spec: gcc@11.2.1 languages:='c,c++,fortran'
      prefix: /usr/tce/packages/gcc/gcc-11.2.1/
      extra_attributes:
        compilers:
          c: /usr/tce/packages/gcc/gcc-11.2.1/bin/gcc
          cxx: /usr/tce/packages/gcc/gcc-11.2.1/bin/g++
          fortran: /usr/tce/packages/gcc/gcc-11.2.1/bin/gfortran
    - spec: gcc@12.2.1 languages:='c,c++,fortran'
      prefix: /usr/tce/packages/gcc/gcc-12.2.1/
      extra_attributes:
        compilers:
          c: /usr/tce/packages/gcc/gcc-12.2.1/bin/gcc
          cxx: /usr/tce/packages/gcc/gcc-12.2.1/bin/g++
          fortran: /usr/tce/packages/gcc/gcc-12.2.1/bin/gfortran
    - spec: gcc@13.3.1 languages:='c,c++'
      prefix: /usr/lib64/ccache
      extra_attributes:
        compilers:
          c: /usr/lib64/ccache/gcc
          cxx: /usr/lib64/ccache/g++
    - spec: gcc@13.3.1 languages:='c,c++,fortran'
      prefix: /usr/tce
      extra_attributes:
        compilers:
          c: /usr/tce/bin/gcc
          cxx: /usr/tce/bin/g++
          fortran: /usr/tce/bin/gfortran
  ##################################################################
  # Extenals found by spack
  ##################################################################
  binutils:
    externals:
    - spec: binutils@2.40~gold~headers
      prefix: /opt/cray/pe/cce/20.0.0/binutils/x86_64/x86_64-pc-linux-gnu
    - spec: binutils@2.30.125~gold+headers
      prefix: /usr
    - spec: binutils@2.40.21~gold~headers
      prefix: /usr/tce
  flex:
    externals:
    - spec: flex@2.6.1+lex
      prefix: /usr
  gettext:
    externals:
    - spec: gettext@0.19.8.1
      prefix: /usr
  gawk:
    externals:
    - spec: gawk@4.2.1
      prefix: /usr
  ccache:
    externals:
    - spec: ccache@3.7.7
      prefix: /usr
  coreutils:
    externals:
    - spec: coreutils@8.30
      prefix: /usr
  openssh:
    externals:
    - spec: openssh@8.0p1
      prefix: /usr
  subversion:
    externals:
    - spec: subversion@1.10.2
      prefix: /usr
  git-lfs:
    externals:
    - spec: git-lfs@3.4.1
      prefix: /usr
    - spec: git-lfs@2.11.0
      prefix: /usr/tce
  diffutils:
    externals:
    - spec: diffutils@3.6
      prefix: /usr
  sed:
    externals:
    - spec: sed@4.5
      prefix: /usr
  doxygen:
    externals:
    - spec: doxygen@1.8.14+graphviz~mscgen
      prefix: /usr
  findutils:
    externals:
    - spec: findutils@4.6.0
      prefix: /usr
  gmake:
    externals:
    - spec: gmake@4.2.1
      prefix: /usr
  groff:
    externals:
    - spec: groff@1.22.3
      prefix: /usr
  swig:
    externals:
    - spec: swig@3.0.12
      prefix: /usr
  perl:
    externals:
    - spec: perl@5.26.3+cpanm+opcode+open+shared+threads
      prefix: /usr
  m4:
    externals:
    - spec: m4@1.4.18
      prefix: /usr
  texinfo:
    externals:
    - spec: texinfo@6.5
      prefix: /usr
  curl:
    externals:
    - spec: curl@7.61.1+gssapi+ldap+nghttp2
      prefix: /usr
  rust:
    externals:
    - spec: rust@1.92.0
      prefix: /usr
      extra_attributes:
        cargo: /usr/bin/cargo
        compilers:
          rust: /usr/bin/rustc
  git:
    externals:
    - spec: git@2.43.7+tcltk
      prefix: /usr
    - spec: git@2.56.1+tcltk
      prefix: /usr/tce
  libtool:
    externals:
    - spec: libtool@2.4.6
      prefix: /usr
  autoconf:
    externals:
    - spec: autoconf@2.69
      prefix: /usr
  cvs:
    externals:
    - spec: cvs@1.11.23
      prefix: /usr
  tar:
    externals:
    - spec: tar@1.30
      prefix: /usr
  zlib:
    externals:
    - spec: zlib@1.2.11
      prefix: /usr
  pkgconf:
    externals:
    - spec: pkgconf@1.4.2
      prefix: /usr
  cmake:
    externals:
    - spec: cmake@3.26.5
      prefix: /usr
    - spec: cmake@3.24.2
      prefix: /usr/tce
  openssl:
    externals:
    - spec: openssl@1.1.1k
      prefix: /usr
  python:
    externals:
    - spec: python@3.6.8+bz2+crypt+ctypes+dbm+lzma+pyexpat~pythoncmd+readline+sqlite3+ssl+tix+tkinter+uuid+zlib
      prefix: /usr
    - spec: python@3.13.2+bz2+ctypes+curses+dbm~freethreading+lzma+pyexpat~pythoncmd+readline+sqlite3+ssl~tix+tkinter+uuid+zlib
      prefix: /usr/tce
  automake:
    externals:
    - spec: automake@1.16.1
      prefix: /usr
  go:
    externals:
    - spec: go@1.24.4
      prefix: /usr
  bison:
    externals:
    - spec: bison@3.0.4
      prefix: /usr
  #########################################################
  # Custom to find the various cray-specific packages
  #########################################################
  tcsh:
    buildable: false
    externals:
    - prefix: /usr
      spec: tcsh@6.20.00
    version: [6.20.00]
  ncurses:
    buildable: false
    externals:
    - prefix: /usr
      spec: ncurses@5.9
    version:
    - '5.9'
  slurm:
    buildable: false
    externals:
    - prefix: /usr
      spec: slurm@21.08.0
    version: [21.08.0]
  cray-libsci:
    buildable: false
    externals:
    - modules:
      - cray-libsci/25.09.0
      spec: cray-libsci@25.09.0
    version: [25.09.0]
  cray-mpich:
    buildable: false
    externals:
    - spec: cray-mpich@9.1.0 +rocm amdgpu_target=gfx942 %gcc@11.2
      prefix: /opt/cray/pe/mpich/9.1.0/ofi/gnu/11.2
      extra_attributes:
        environment:
          prepend_path:
            LD_LIBRARY_PATH: /opt/cray/pe/lib64:/opt/cray/libfabric/2.1/lib64
    - spec: cray-mpich@9.1.0 +rocm amdgpu_target=gfx942 %llvm-amdgpu@7.2.1
      prefix: /opt/cray/pe/mpich/9.1.0/ofi/rocm-compiler/7.0
      extra_attributes:
        environment:
          prepend_path:
            LD_LIBRARY_PATH: /opt/cray/pe/lib64:/opt/cray/libfabric/2.1/lib64
    - spec: cray-mpich@9.1.0 +rocm amdgpu_target=gfx942 %cce@20
      prefix: /opt/cray/pe/mpich/9.1.0/ofi/crayclang/20.0
      extra_attributes:
        environment:
          prepend_path:
            LD_LIBRARY_PATH: /opt/cray/pe/lib64:/opt/cray/libfabric/2.1/lib64
  cray-fftw:
    buildable: false
    externals:
    - spec: cray-fftw@3.3.10.11
      prefix: /opt/cray/pe/fftw/3.3.10.11
    variants: precision=float,double,long_double
  hdf5:
    buildable: false
    externals:
    - spec: hdf5@1.14.3.9 +mpi %cce@20
      prefix: /opt/cray/pe/hdf5-parallel/1.14.3.9/crayclang/20.0
    - spec: hdf5@1.14.3.9 +mpi %gcc@12.2.1
      prefix: /opt/cray/pe/hdf5-parallel/1.14.3.9/gnu/12.2
    - spec: hdf5@1.14.3.9 +mpi %llvm-amdgpu@7.2.1
      prefix: /opt/cray/pe/hdf5-parallel/1.14.3.9/amd/7.0
  hip:
    buildable: false
    externals:
    - spec: hip@7.2.1
      prefix: /opt/rocm-7.2.1
      extra_attributes:
        compilers:
          hip: /opt/rocm-7.2.1/bin/hipcc
  hipblas:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: hipblas@7.2.1
  hipcub:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: hipcub@7.2.1
  hipfft:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: hipfft@7.2.1
  hipfort:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: hipfort@7.2.1
  hipify-clang:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: hipify-clang@7.2.1
  hipsparse:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: hipsparse@7.2.1
  hsa-rocr-dev:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: hsa-rocr-dev@7.2.1
  libfabric:
    buildable: true
    externals:
    - prefix: /opt/cray/libfabric/2.1
      spec: libfabric@2.1
    - prefix: /opt/cray/libfabric/2.0
      spec: libfabric@2.0
    - prefix: /opt/cray/libfabric/1.7.2-llnl
      spec: libfabric@1.7.2
    version:
    - '2.1'
    - '2.0'
    - 1.7.2
    variants: fabrics=cxi,rxm,sockets,tcp,udp
  llvm-amdgpu:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1/llvm
      spec: llvm-amdgpu@7.2.1
      extra_attributes:
        compilers:
          c: /opt/rocm-7.2.1/llvm/bin/amdclang
          cxx: /opt/rocm-7.2.1/llvm/bin/amdclang++
          fortran: /opt/rocm-7.2.1/llvm/bin/amdflang
  miopen-hip:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: miopen-hip@7.2.1
  parallel-netcdf:
    buildable: true
    variants: +cxx+fortran
    version: []
  rccl:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rccl@7.2.1
  rocalution:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocalution@7.2.1
  rocblas:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocblas@7.2.1
  rocfft:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocfft@7.2.1
  rocm-cmake:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocm-cmake@7.2.1
  rocm-device-libs:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocm-device-libs@7.2.1
  rocm-gdb:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocm-gdb@7.2.1
  rocm-opencl:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocm-opencl@7.2.1
  rocm-openmp-extras:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1/llvm
      spec: rocm-openmp-extras@7.2.1
  rocm-smi-lib:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocm-smi-lib@7.2.1
  amdsmi:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: amdsmi@7.2.1
  rocminfo:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocminfo@7.2.1
  rocprim:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocprim@7.2.1
  rocprofiler-dev:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocprofiler-dev@7.2.1
  rocrand:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocrand@7.2.1
  rocsolver:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocsolver@7.2.1
  rocsparse:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocsparse@7.2.1
  rocthrust:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: rocthrust@7.2.1
  roctracer-dev:
    buildable: false
    externals:
    - prefix: /opt/rocm-7.2.1
      spec: roctracer-dev@7.2.1
  papi:
    buildable: false
    externals:
    - modules:
      - papi/7.3.0.1
      spec: papi@7.3.0.1
    version: [7.3.0.1]
  #########################################################
  # Stuff we need for building on this system in particular
  #########################################################
  kokkos:
    require: "+apu"
  silo:
    require: "~hzip~python"
