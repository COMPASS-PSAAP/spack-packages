# Easley packages.yaml
# Version 1.1
#
# CARC's own Spack installation supplies Easley's compilers, CUDA, MPI,
# and HDF5, so this file names no externals. upstreams.yaml, beside this
# file, points your Spack at it as an upstream; include.yaml applies both
# on Easley only.
packages:
  all:
    providers:
      # CARC builds OpenMPI with and without CUDA; its MVAPICH2 has no
      # CUDA support
      mpi: [openmpi, mvapich2]
