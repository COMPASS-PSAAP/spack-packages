# Easley packages.yaml
# Version 1.0
#
# CARC's own Spack installation supplies Easley's compilers, CUDA, MPI,
# and HDF5, so this file names no externals. Point your Spack at it as an
# upstream in ~/.spack/upstreams.yaml instead:
#
#   upstreams:
#     carc-spack:
#       install_tree: /opt/spack/opt/spack
packages:
  all:
    providers:
      # CARC builds OpenMPI with and without CUDA; its MVAPICH2 has no
      # CUDA support
      mpi: [openmpi, mvapich2]
