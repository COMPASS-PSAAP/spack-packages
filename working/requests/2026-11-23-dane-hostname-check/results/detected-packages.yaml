packages:
  tar:
    externals:
    - spec: tar@1.30
      prefix: /usr
  flex:
    externals:
    - spec: flex@2.6.1+lex
      prefix: /usr
  openssh:
    externals:
    - spec: openssh@8.0p1
      prefix: /usr
  binutils:
    externals:
    - spec: binutils@2.30.128~gold+headers
      prefix: /usr
  sed:
    externals:
    - spec: sed@4.5
      prefix: /usr
  cvs:
    externals:
    - spec: cvs@1.11.23
      prefix: /usr
  rust:
    externals:
    - spec: rust@1.92.0
      prefix: /usr
      extra_attributes:
        cargo: /usr/bin/cargo
        compilers:
          rust: /usr/bin/rustc
  go:
    externals:
    - spec: go@1.26.7
      prefix: /usr
  ccache:
    externals:
    - spec: ccache@3.7.7
      prefix: /usr
  pkgconf:
    externals:
    - spec: pkgconf@1.4.2
      prefix: /usr
  subversion:
    externals:
    - spec: subversion@1.10.2
      prefix: /usr
  automake:
    externals:
    - spec: automake@1.16.1
      prefix: /usr
  diffutils:
    externals:
    - spec: diffutils@3.6
      prefix: /usr
  git-lfs:
    externals:
    - spec: git-lfs@3.4.1
      prefix: /usr
    - spec: git-lfs@2.11.0
      prefix: /usr/tce
  autoconf:
    externals:
    - spec: autoconf@2.69
      prefix: /usr
  gettext:
    externals:
    - spec: gettext@0.19.8.1
      prefix: /usr
  bison:
    externals:
    - spec: bison@3.0.4
      prefix: /usr
  perl:
    externals:
    - spec: perl@5.26.3+cpanm+opcode+open+shared+threads
      prefix: /usr
  gmake:
    externals:
    - spec: gmake@4.2.1
      prefix: /usr
  coreutils:
    externals:
    - spec: coreutils@8.30
      prefix: /usr
  python:
    externals:
    - spec: python@2.7.18+bz2+crypt+ctypes+curses+dbm~lzma+pyexpat~pythoncmd+readline+sqlite3+ssl~tkinter+uuid+zlib
      prefix: /usr
    - spec: python@3.6.8+bz2+crypt+ctypes+curses+dbm+lzma+pyexpat~pythoncmd+readline+sqlite3+ssl+tix+tkinter+uuid+zlib
      prefix: /usr
    - spec: python@2.7.18+bz2+crypt+ctypes+curses+dbm~lzma+pyexpat~pythoncmd+readline+sqlite3+ssl+tix+tkinter+uuid+zlib
      prefix: /usr/tce
    - spec: python@3.13.2+bz2+ctypes+curses+dbm~freethreading+lzma+pyexpat~pythoncmd+readline+sqlite3+ssl~tix+tkinter+uuid+zlib
      prefix: /usr/tce
  m4:
    externals:
    - spec: m4@1.4.18
      prefix: /usr
  libtool:
    externals:
    - spec: libtool@2.4.6
      prefix: /usr
  groff:
    externals:
    - spec: groff@1.22.3
      prefix: /usr
  findutils:
    externals:
    - spec: findutils@4.6.0
      prefix: /usr
  zlib:
    externals:
    - spec: zlib@1.2.11
      prefix: /usr
  curl:
    externals:
    - spec: curl@7.61.1+gssapi+ldap+nghttp2
      prefix: /usr
  cmake:
    externals:
    - spec: cmake@3.26.5
      prefix: /usr
    - spec: cmake@3.23.1
      prefix: /usr/tce
  git:
    externals:
    - spec: git@2.43.7+tcltk
      prefix: /usr
    - spec: git@2.29.1+tcltk
      prefix: /usr/tce
  texinfo:
    externals:
    - spec: texinfo@6.5
      prefix: /usr
  gawk:
    externals:
    - spec: gawk@4.2.1
      prefix: /usr
  swig:
    externals:
    - spec: swig@3.0.12
      prefix: /usr
  openssl:
    externals:
    - spec: openssl@1.1.1k
      prefix: /usr
    - spec: openssl@3.5.5
      prefix: /usr
  intel-oneapi-compilers-classic:
    externals:
    - spec: intel-oneapi-compilers-classic@2021.6.0
      prefix: /usr/tce/packages/intel-classic/intel-classic-2021.6.0-magic
      extra_attributes:
        compilers:
          c: /usr/tce/packages/intel-classic/intel-classic-2021.6.0-magic/bin/icc
          cxx: /usr/tce/packages/intel-classic/intel-classic-2021.6.0-magic/bin/icpc
          fortran: /usr/tce/packages/intel-classic/intel-classic-2021.6.0-magic/bin/ifort
  llvm:
    externals:
    - spec: llvm@21.1.8+clang~flang+lld+lldb
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang
          cxx: /usr/bin/clang++
    - spec: llvm@21.1.8+clang~flang~lld~lldb
      prefix: /usr/lib64/ccache
      extra_attributes:
        compilers:
          c: /usr/lib64/ccache/clang
          cxx: /usr/lib64/ccache/clang++
  gcc:
    externals:
    - spec: gcc@8.5.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
    - spec: gcc@10.3.1 languages:='c,c++'
      prefix: /usr/lib64/ccache
      extra_attributes:
        compilers:
          c: /usr/lib64/ccache/gcc
          cxx: /usr/lib64/ccache/g++
    - spec: gcc@10.3.1 languages:='c,c++,fortran'
      prefix: /usr/tce
      extra_attributes:
        compilers:
          c: /usr/tce/bin/gcc
          cxx: /usr/tce/bin/g++
          fortran: /usr/tce/bin/gfortran
